<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0;background:var(--canvas)}.wrap{width:1400px;transform:scale(.5);transform-origin:top left;padding:24px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px;align-items:start}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const N = window.WarmCanvasDesignSystem_d8b88e;
const { FeatureCard, CodeWindowCard, ModelComparisonCard, PricingTierCard, CalloutCard, ConnectorTile, CookieConsentCard, Button, TextLink, Badge } = N;
const code = `def review(diff):\n    notes = claude.messages.create(\n        model="claude-sonnet-4-5",\n        messages=[{"role":"user","content":diff}],\n    )\n    return notes.content`;
ReactDOM.createRoot(document.getElementById("root")).render(<div className="wrap">
  <FeatureCard title="Connect your tools" eyebrow="Context">Pull answers from the systems your team already works in, with permissions intact.</FeatureCard>
  <ModelComparisonCard name="Opus" tagline="For the hardest problems" badge={<Badge tone="coral">New</Badge>} meta={[{label:"Context",value:"200K"},{label:"Latency",value:"Slower"}]} link={<TextLink>Read the model guide</TextLink>}>Deep reasoning across long documents and multi-step agent runs.</ModelComparisonCard>
  <PricingTierCard name="Team" price="$30" cadence="/ person / mo" featured blurb="For teams standardising on Claude." ctaLabel="Start a trial" features={["Everything in Pro","Central billing","Shared projects"]} />
  <div style={{display:"flex",flexDirection:"column",gap:20}}>
    <ConnectorTile name="Drive" status="connected">Search and cite documents.</ConnectorTile>
    <CookieConsentCard>We use cookies to understand how the site is used.</CookieConsentCard>
  </div>
  <div style={{gridColumn:"span 2"}}><CodeWindowCard filename="review.py" code={code} statusLeft="connected" statusRight="claude-sonnet-4-5" actions={<Button variant="secondaryOnDark">Run</Button>} terminal={"$ python review.py\n2 suggestions · 1 blocking"} /></div>
  <div style={{gridColumn:"span 2"}}><CalloutCard title="Start building today" actions={<Button variant="onCoral">Get an API key</Button>}>Ship your first agent in an afternoon.</CalloutCard></div>
</div>);
</script></body></html>
