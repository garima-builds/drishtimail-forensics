<!DOCTYPE html><html><head><meta charset="utf-8"><title>Radius</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--canvas);font-family:var(--font-sans)}.sw{display:flex;gap:12px;flex-wrap:wrap}.chip{width:104px}.box{height:56px;border-radius:var(--radius-md);border:1px solid rgba(20,20,19,.06)}.nm{font-size:12px;font-weight:500;color:var(--text-ink);margin-top:8px;display:block}.hx{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);display:block}.row{display:flex;align-items:baseline;gap:16px}.tk{font-family:var(--font-mono);font-size:11px;color:var(--text-muted-soft);white-space:nowrap}</style></head><body><div class="sw">
<div class="chip" style="width:96px"><div style="height:56px;background:var(--surface-card);border:1px solid var(--hairline);border-radius:4px"></div><span class="nm">--radius-xs</span><span class="hx">4px</span></div><div class="chip" style="width:96px"><div style="height:56px;background:var(--surface-card);border:1px solid var(--hairline);border-radius:6px"></div><span class="nm">--radius-sm</span><span class="hx">6px</span></div><div class="chip" style="width:96px"><div style="height:56px;background:var(--surface-card);border:1px solid var(--hairline);border-radius:8px"></div><span class="nm">--radius-md</span><span class="hx">8px</span></div><div class="chip" style="width:96px"><div style="height:56px;background:var(--surface-card);border:1px solid var(--hairline);border-radius:12px"></div><span class="nm">--radius-lg</span><span class="hx">12px</span></div><div class="chip" style="width:96px"><div style="height:56px;background:var(--surface-card);border:1px solid var(--hairline);border-radius:16px"></div><span class="nm">--radius-xl</span><span class="hx">16px</span></div><div class="chip" style="width:96px"><div style="height:56px;background:var(--surface-card);border:1px solid var(--hairline);border-radius:9999px"></div><span class="nm">--radius-pill</span><span class="hx">pill</span></div>
</div></body></html>
