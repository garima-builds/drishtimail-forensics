<!DOCTYPE html><html><head><meta charset="utf-8"><title>Spacing</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--canvas);font-family:var(--font-sans)}.sw{display:flex;gap:12px;flex-wrap:wrap}.chip{width:104px}.box{height:56px;border-radius:var(--radius-md);border:1px solid rgba(20,20,19,.06)}.nm{font-size:12px;font-weight:500;color:var(--text-ink);margin-top:8px;display:block}.hx{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);display:block}.row{display:flex;align-items:baseline;gap:16px}.tk{font-family:var(--font-mono);font-size:11px;color:var(--text-muted-soft);white-space:nowrap}</style></head><body><div style="display:flex;flex-direction:column;gap:8px">
<div class="row"><span class="tk" style="width:96px">--space-xxs</span><span style="height:10px;width:4px;background:var(--primary);border-radius:2px"></span><span class="tk">4px</span></div><div class="row"><span class="tk" style="width:96px">--space-xs</span><span style="height:10px;width:8px;background:var(--primary);border-radius:2px"></span><span class="tk">8px</span></div><div class="row"><span class="tk" style="width:96px">--space-sm</span><span style="height:10px;width:12px;background:var(--primary);border-radius:2px"></span><span class="tk">12px</span></div><div class="row"><span class="tk" style="width:96px">--space-md</span><span style="height:10px;width:16px;background:var(--primary);border-radius:2px"></span><span class="tk">16px</span></div><div class="row"><span class="tk" style="width:96px">--space-lg</span><span style="height:10px;width:24px;background:var(--primary);border-radius:2px"></span><span class="tk">24px</span></div><div class="row"><span class="tk" style="width:96px">--space-xl</span><span style="height:10px;width:32px;background:var(--primary);border-radius:2px"></span><span class="tk">32px</span></div><div class="row"><span class="tk" style="width:96px">--space-xxl</span><span style="height:10px;width:48px;background:var(--primary);border-radius:2px"></span><span class="tk">48px</span></div><div class="row"><span class="tk" style="width:96px">--space-section</span><span style="height:10px;width:96px;background:var(--primary);border-radius:2px"></span><span class="tk">96px</span></div>
</div></body></html>
