<!DOCTYPE html><html><head><meta charset="utf-8"><title>Pacing</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--canvas);font-family:var(--font-sans)}.sw{display:flex;gap:12px;flex-wrap:wrap}.chip{width:104px}.box{height:56px;border-radius:var(--radius-md);border:1px solid rgba(20,20,19,.06)}.nm{font-size:12px;font-weight:500;color:var(--text-ink);margin-top:8px;display:block}.hx{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);display:block}.row{display:flex;align-items:baseline;gap:16px}.tk{font-family:var(--font-mono);font-size:11px;color:var(--text-muted-soft);white-space:nowrap}</style></head><body><div style="display:flex;height:100px;border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--hairline)">
<div style="flex:1;background:var(--canvas);display:flex;align-items:flex-end;padding:10px"><span style="font-size:11px;font-weight:500;color:var(--text-ink)">Canvas</span></div><div style="flex:1;background:var(--surface-card);display:flex;align-items:flex-end;padding:10px"><span style="font-size:11px;font-weight:500;color:var(--text-ink)">Cream card</span></div><div style="flex:1;background:var(--surface-dark);display:flex;align-items:flex-end;padding:10px"><span style="font-size:11px;font-weight:500;color:var(--text-on-dark)">Navy product</span></div><div style="flex:1;background:var(--primary);display:flex;align-items:flex-end;padding:10px"><span style="font-size:11px;font-weight:500;color:var(--on-primary)">Coral callout</span></div><div style="flex:1;background:var(--surface-dark);display:flex;align-items:flex-end;padding:10px"><span style="font-size:11px;font-weight:500;color:var(--text-on-dark)">Footer</span></div>
</div></body></html>
