<!DOCTYPE html><html><head><meta charset="utf-8"><title>Status</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--canvas);font-family:var(--font-sans)}.sw{display:flex;gap:12px;flex-wrap:wrap}.chip{width:104px}.box{height:56px;border-radius:var(--radius-md);border:1px solid rgba(20,20,19,.06)}.nm{font-size:12px;font-weight:500;color:var(--text-ink);margin-top:8px;display:block}.hx{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);display:block}.row{display:flex;align-items:baseline;gap:16px}.tk{font-family:var(--font-mono);font-size:11px;color:var(--text-muted-soft);white-space:nowrap}</style></head><body><div class="sw">
<div class="chip"><div class="box" style="background:var(--success)"></div><span class="nm">Success</span><span class="hx">#5db872</span></div><div class="chip"><div class="box" style="background:var(--warning)"></div><span class="nm">Warning</span><span class="hx">#d4a017</span></div><div class="chip"><div class="box" style="background:var(--error)"></div><span class="nm">Error</span><span class="hx">#c64545</span></div>
</div></body></html>
