<!-- @dsCard group="Colors" viewport="700x150" name="Hairlines" subtitle="Borders read as one elevation step, never as ink lines" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Hairlines</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--canvas);font-family:var(--font-sans)}.sw{display:flex;gap:12px;flex-wrap:wrap}.chip{width:104px}.box{height:56px;border-radius:var(--radius-md);border:1px solid rgba(20,20,19,.06)}.nm{font-size:12px;font-weight:500;color:var(--text-ink);margin-top:8px;display:block}.hx{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);display:block}.row{display:flex;align-items:baseline;gap:16px}.tk{font-family:var(--font-mono);font-size:11px;color:var(--text-muted-soft);white-space:nowrap}</style></head><body><div style="display:flex;gap:16px">
<div style="flex:1;background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--radius-lg);padding:16px"><span class="nm" style="margin:0">--hairline</span><span class="hx">#e6dfd8 · card + input border</span></div>
<div style="flex:1;background:var(--canvas);border:1px solid var(--hairline-soft);border-radius:var(--radius-lg);padding:16px"><span class="nm" style="margin:0">--hairline-soft</span><span class="hx">#ebe6df · in-band divider</span></div>
<div style="flex:1;background:var(--surface-dark);border:1px solid var(--hairline-dark);border-radius:var(--radius-lg);padding:16px"><span class="nm" style="margin:0;color:var(--text-on-dark)">--hairline-dark</span><span class="hx" style="color:var(--text-on-dark-soft)">#302d29 · inside navy cards</span></div>
</div></body></html>
