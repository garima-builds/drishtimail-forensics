<!DOCTYPE html><html><head><meta charset="utf-8"><title>Text ramp</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--canvas);font-family:var(--font-sans)}.sw{display:flex;gap:12px;flex-wrap:wrap}.chip{width:104px}.box{height:56px;border-radius:var(--radius-md);border:1px solid rgba(20,20,19,.06)}.nm{font-size:12px;font-weight:500;color:var(--text-ink);margin-top:8px;display:block}.hx{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);display:block}.row{display:flex;align-items:baseline;gap:16px}.tk{font-family:var(--font-mono);font-size:11px;color:var(--text-muted-soft);white-space:nowrap}</style></head><body><div style="display:flex;flex-direction:column;gap:10px">
<div class="row"><span style="width:16px;height:16px;border-radius:50%;background:var(--text-ink)"></span><span style="font-size:15px;color:var(--text-ink);width:150px">Headlines and primary text</span><span class="tk">--text-ink · #141413</span></div><div class="row"><span style="width:16px;height:16px;border-radius:50%;background:var(--text-body-strong)"></span><span style="font-size:15px;color:var(--text-body-strong);width:150px">Lead paragraphs</span><span class="tk">--text-body-strong · #252523</span></div><div class="row"><span style="width:16px;height:16px;border-radius:50%;background:var(--text-body)"></span><span style="font-size:15px;color:var(--text-body);width:150px">Default running text</span><span class="tk">--text-body · #3d3d3a</span></div><div class="row"><span style="width:16px;height:16px;border-radius:50%;background:var(--text-muted)"></span><span style="font-size:15px;color:var(--text-muted);width:150px">Sub-heads, breadcrumbs</span><span class="tk">--text-muted · #6c6a64</span></div><div class="row"><span style="width:16px;height:16px;border-radius:50%;background:var(--text-muted-soft)"></span><span style="font-size:15px;color:var(--text-muted-soft);width:150px">Captions, copyright</span><span class="tk">--text-muted-soft · #8e8b82</span></div>
</div></body></html>
