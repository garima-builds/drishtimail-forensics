<!-- @dsCard group="Spacing" viewport="700x170" name="Elevation & focus" subtitle="Colour-block first; one faint shadow, one coral focus ring" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Elevation</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--canvas);font-family:var(--font-sans)}.sw{display:flex;gap:12px;flex-wrap:wrap}.chip{width:104px}.box{height:56px;border-radius:var(--radius-md);border:1px solid rgba(20,20,19,.06)}.nm{font-size:12px;font-weight:500;color:var(--text-ink);margin-top:8px;display:block}.hx{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);display:block}.row{display:flex;align-items:baseline;gap:16px}.tk{font-family:var(--font-mono);font-size:11px;color:var(--text-muted-soft);white-space:nowrap}</style></head><body><div style="display:flex;gap:16px;align-items:center">
<div style="flex:1;background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--radius-lg);padding:16px"><span class="nm" style="margin:0">Hairline</span><span class="hx">--border-hairline</span></div>
<div style="flex:1;background:var(--surface-card);border-radius:var(--radius-lg);padding:16px"><span class="nm" style="margin:0">Cream card</span><span class="hx">no border, no shadow</span></div>
<div style="flex:1;background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-subtle)"><span class="nm" style="margin:0">Subtle shadow</span><span class="hx">0 1px 3px rgba(20,20,19,.08)</span></div>
<div style="flex:1"><input placeholder="Focused input" style="width:100%;height:40px;padding:10px 14px;border-radius:var(--radius-md);background:var(--canvas);border:1px solid var(--primary);box-shadow:var(--focus-ring);font-family:var(--font-sans);font-size:16px;color:var(--text-ink)"><span class="hx" style="margin-top:6px">--focus-ring</span></div>
</div></body></html>
