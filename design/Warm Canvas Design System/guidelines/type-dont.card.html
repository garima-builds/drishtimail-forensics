<!-- @dsCard group="Type" viewport="700x180" name="Display do / don't" subtitle="Keep serif at 400 with negative tracking; never bold, never sans" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Do / don't</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--canvas);font-family:var(--font-sans)}.sw{display:flex;gap:12px;flex-wrap:wrap}.chip{width:104px}.box{height:56px;border-radius:var(--radius-md);border:1px solid rgba(20,20,19,.06)}.nm{font-size:12px;font-weight:500;color:var(--text-ink);margin-top:8px;display:block}.hx{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);display:block}.row{display:flex;align-items:baseline;gap:16px}.tk{font-family:var(--font-mono);font-size:11px;color:var(--text-muted-soft);white-space:nowrap}</style></head><body><div style="display:flex;gap:16px">
<div style="flex:1;background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--radius-lg);padding:16px"><div class="ds-display-sm">Thinking partner</div><span class="tk" style="color:var(--success)">DO · serif 400, -0.3px</span></div>
<div style="flex:1;background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--radius-lg);padding:16px"><div style="font-family:var(--font-display);font-weight:700;font-size:28px;letter-spacing:0;color:var(--text-ink)">Thinking partner</div><span class="tk" style="color:var(--error)">DON'T · serif 700, no tracking</span></div>
<div style="flex:1;background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--radius-lg);padding:16px"><div style="font-family:var(--font-sans);font-weight:600;font-size:28px;color:var(--text-ink)">Thinking partner</div><span class="tk" style="color:var(--error)">DON'T · sans display</span></div>
</div></body></html>
