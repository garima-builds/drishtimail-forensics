      {title:"Product",links:["Claude","Claude Code","Connectors","API","Pricing"]},
      {title:"Company",links:["About","Careers","News","Research"]},
      {title:"Resources",links:["Docs","Model guide","Status","Support"]},
      {title:"Legal",links:["Privacy","Terms","Usage policy","Trust centre"]}]}
      meta={["Privacy","Terms","Cookie settings"]} />

      <CookieConsentCard onAccept={()=>setConsent(false)} onReject={()=>setConsent(false)}>
        We use cookies to understand how the site is used and to improve it. You can change this any time.
      </CookieConsentCard></div>)}

}
ReactDOM.createRoot(document.getElementById("root")).render(<Site/>);
